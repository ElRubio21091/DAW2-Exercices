<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuaris de Popflix</title>
</head>
<body>
  <h1>Usuaris de Popflix</h1>

  <h2>Dades de l'usuari</h2>
  <label for="dni">DNI:</label>
  <input type="text" id="dni" placeholder="12345678A"><br><br>

  <label for="nom">Nom i cognoms:</label>
  <input type="text" id="nom" placeholder="Nom Cognom1 Cognom2"><br><br>

  <label for="email">E-mail:</label>
  <input type="email" id="email" placeholder="correu@exemple.com"><br><br>

  <label for="targeta">Targeta:</label>
  <input type="text" id="targeta" placeholder="Número de targeta"><br><br>

  <button id="afegir">Afegir</button>
  <button id="esborrar">Esborrar</button>
  <button id="obtenir">Obtenir</button>
  <button id="modificar">Modificar</button>
  <button id="mostrar">Mostrar tots</button>
  <button id="provar">Executar proves</button>

  <h2>Resultat</h2>
  <textarea id="resultat" rows="12" cols="60" readonly></textarea>

  <script type="module" src="main.js"></script>
</body>
</html>
