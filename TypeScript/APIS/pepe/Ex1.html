<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mode de pantalla completa</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #1e2a38;
      color: #f2f2f2;
    }
    /* Este es el elemento que pasará a pantalla completa (la "aplicación") */
    #app {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e2a38;
    }
    #btn-fullscreen {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border: 2px solid #f2f2f2;
      border-radius: 8px;
      background: transparent;
      color: #f2f2f2;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    #btn-fullscreen:hover { background: rgba(255, 255, 255, 0.15); }
    #btn-fullscreen:focus-visible { outline: 3px solid #7aa2ff; outline-offset: 2px; }
    #btn-fullscreen svg { width: 24px; height: 24px; }
    /* Solo se muestra uno de los dos iconos según el estado */
    #btn-fullscreen .icon-exit { display: none; }
    #btn-fullscreen.activo .icon-enter { display: none; }
    #btn-fullscreen.activo .icon-exit { display: block; }
  </style>
</head>
<body>
  <div id="app">
    <h1>La meva aplicació</h1>

    <button id="btn-fullscreen" aria-label="Pantalla completa" title="Pantalla completa">
      <!-- Icono: ampliar (esquinas hacia fuera) -->
      <svg class="icon-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
      <!-- Icono: reducir (esquinas hacia dentro) -->
      <svg class="icon-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
      </svg>
    </button>
  </div>

  <script>
    const app = document.getElementById('app');
    const boton = document.getElementById('btn-fullscreen');

    // Al hacer clic: entrar o salir de pantalla completa
    boton.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        app.requestFullscreen();      // entrar
      } else {
        document.exitFullscreen();    // salir
      }
    });

    // Se dispara siempre que cambia el estado (también al pulsar Esc),
    // así el icono nunca se desincroniza.
    document.addEventListener('fullscreenchange', () => {
      const activo = !!document.fullscreenElement;
      boton.classList.toggle('activo', activo);
      const texto = activo ? 'Sortir de la pantalla completa' : 'Pantalla completa';
      boton.setAttribute('aria-label', texto);
      boton.title = texto;
    });

    async function cargarPersonajes() {
      try {
        const respuesta = await fetch("https://umapyoi.net/api/v1/character/list");

        if (!respuesta.ok) {
          throw new Error("Error HTTP: " + respuesta.status);
        }

        const personajes = await respuesta.json();
        console.log(personajes); // mira aquí qué campos trae cada personaje
      } catch (error) {
        console.error("No se pudo conectar con la API:", error);
      }
    }

    cargarPersonajes();
  </script>
</body>
</html>
